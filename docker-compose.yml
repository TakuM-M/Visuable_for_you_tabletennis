services:
  # ========================================
  # PostgreSQL データベース
  # ========================================
  postgres:
    image: postgres:16
    container_name: tabletennis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tabletennis-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # FastAPI バックエンド
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: tabletennis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app                     # ホットリロード用
      - ./ml/models:/app/ml/models:ro      # MLモデルを読み取り専用でマウント
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-false}
    networks:
      - tabletennis-net

  # ========================================
  # React フロントエンド
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tabletennis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend:/app                    # ホットリロード用
      - /app/node_modules                  # node_modules はコンテナ内のものを使用
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    networks:
      - tabletennis-net

# ========================================
# ボリューム定義
# ========================================
volumes:
  postgres-data:
    driver: local

# ========================================
# ネットワーク定義
# ========================================
networks:
  tabletennis-net:
    driver: bridge
