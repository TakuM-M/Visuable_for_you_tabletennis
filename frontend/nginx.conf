server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router の history モード対応（全パスを index.html へフォールバック）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API へのプロキシ（本番環境用）
    location /api/ {
        rewrite ^/api/(.*) /$1 break;  # /api を除去して転送
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
