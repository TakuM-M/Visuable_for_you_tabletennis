[project]
name = "tabletennis-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # API フレームワーク
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    # データベース
    "sqlalchemy==2.0.36",
    "alembic==1.13.3",
    "psycopg2-binary==2.9.10",
    # バリデーション
    "pydantic==2.9.2",
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.6.0",
    # ユーティリティ
    "python-dotenv==1.0.1",
    "python-multipart==0.0.12",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",    # FastAPI テスト用
]
