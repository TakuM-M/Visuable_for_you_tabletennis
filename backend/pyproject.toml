[project]
name = "tabletennis-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # API フレームワーク
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    # データベース
    "sqlalchemy==2.0.36",
    "alembic==1.13.3",
    "psycopg2-binary==2.9.10",
    # バリデーション
    "pydantic==2.9.2",
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.6.0",
    # 認証
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",  # passlib 1.7.4 との互換性のため固定
    # ユーティリティ
    "python-dotenv==1.0.1",
    "python-multipart==0.0.12",
    "httpx==0.27.2",    # MLサービス呼び出し用
    "resend>=2.0.0",     # メール送信用
    "boto3>=1.35.0",     # Cloudflare R2 (S3互換) ストレージ用
    "apscheduler>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",    # FastAPI テスト用
    "ruff>=0.15.21",
]
