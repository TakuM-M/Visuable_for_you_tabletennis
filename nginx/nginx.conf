# Cloudflare の実クライアント IP を抽出
map $http_cf_connecting_ip $client_ip {
    default $remote_addr;
    "~*." $http_cf_connecting_ip;
}

# アップロード系エンドポイント: チャンク分割アップロードは 1 動画で
# init + チャンク（50MBごと）+ complete のリクエストが連続する（5GB動画で約100件）ため、
# それを妨げないレートにする（2r/s per IP）。帯域自体が実質的な上限になる。
limit_req_zone $client_ip zone=upload_per_ip:10m rate=2r/s;
# 一般 API: 60リクエスト/分 per IP
limit_req_zone $client_ip zone=api_per_ip:10m rate=60r/m;

# HTTP → HTTPS リダイレクト
server {
    listen 80;
    server_name visualize-tt.com;
    return 301 https://$host$request_uri;
}

# HTTPS サーバー
server {
    listen 443 ssl;
    server_name visualize-tt.com;

    # Cloudflare Origin Certificate
    ssl_certificate /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;

    # チャンクアップロード対応: 各チャンク50MB + multipart オーバーヘッド。
    # frontend/src/lib/chunkedUpload.ts の CHUNK_SIZE(50MB) と連動しており、
    # CHUNK_SIZE を上げる場合はこの値も追従させること（この値超過は 413 になる）。
    # 上限の根拠: Cloudflare プロキシ経由のため 1 リクエストは 100MB まで（Free プラン、変更不可）。
    client_max_body_size 60M;
    # クライアントからのボディ受信タイムアウト（大容量動画アップロード対応）。
    # 長時間動画ほどチャンク本数が増え、モバイル回線で 1 本の送信中に
    # 一時的な停止（トンネル・電波移動）を挟む確率も上がるため長めに取る
    client_body_timeout 600s;

    # チャンク分割アップロード（連続するチャンク送信を許容: 2r/s + burst）
    location ~ ^/api/videos/upload/ {
        limit_req zone=upload_per_ip burst=30 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # その他の /api/videos（中程度の制限: 60r/m）
    location ~ ^/api/videos {
        limit_req zone=api_per_ip burst=20 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 一般 API リクエスト → backend（/api/ プレフィックスを除去して転送）
    location /api/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 内部 API（RunPod → backend）
    location /internal/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # フロントエンド → React 静的ファイル
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
