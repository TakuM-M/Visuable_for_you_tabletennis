# アップロード系エンドポイント: 10リクエスト/分 per IP
limit_req_zone $binary_remote_addr zone=upload_per_ip:10m rate=10r/m;
# 一般 API: 60リクエスト/分 per IP
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=60r/m;

# HTTP → HTTPS リダイレクト
server {
    listen 80;
    server_name visualize-tt.com;
    return 301 https://$host$request_uri;
}

# HTTPS サーバー
server {
    listen 443 ssl;
    server_name visualize-tt.com;

    # Cloudflare Origin Certificate
    ssl_certificate /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;

    # チャンクアップロード対応: 各チャンク50MB + オーバーヘッド
    client_max_body_size 60M;
    # クライアントからのボディ受信タイムアウト（大容量動画アップロード対応）
    client_body_timeout 300s;

    # アップロード系エンドポイント（正規表現ロケーションが /api/ より優先される）
    location ~ ^/api/videos {
        limit_req zone=upload_per_ip burst=5 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API リクエスト → backend（/api/ プレフィックスを除去して転送）
    location /api/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 内部 API（RunPod → backend）
    location /internal/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # フロントエンド → React 静的ファイル
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
