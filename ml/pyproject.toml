[project]
name = "tabletennis-ml"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # 動画処理
    "opencv-python==4.10.0.84",
    # 物体検出・姿勢推定
    "ultralytics>=8.0.0",
    # 深層学習
    # torchvision は直接 import しないが ultralytics が必要とするため残す。
    # Linux では CUDA ランタイム（nvidia-*-cu12）が wheel の依存として同梱されるので
    # Docker イメージ側に CUDA を用意する必要はない。
    "torch==2.5.1",
    "torchvision==0.20.1",
    # 数値計算・データ処理
    "numpy==1.26.4",
    "scipy==1.13.0",
    "pandas>=2.0.0",
    # 可視化
    "matplotlib==3.9.0",
    "pillow==10.3.0",
    # ユーティリティ
    "tqdm==4.66.4",
    "python-dotenv==1.0.1",
    "httpx",
    # RunPod Serverless ワーカー
    "runpod>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest==8.2.1",
    "pytest-cov==5.0.0",
]
# 学習時のみ使う依存。推論イメージ（runpod-worker）には含めない
training = [
    "tensorboard>=2.13.0",
]

[tool.uv]
# ローカル開発・学習環境では dev / training も既定で入れる。
# 推論イメージ側は Dockerfile が --no-default-groups で本体依存のみに絞る。
default-groups = ["dev", "training"]

# ─────────────────────────────────────────────────
# PyTorch CUDA インデックス設定
#
# Linux（Docker）環境では CUDA 12.4 対応版を使用する（Blackwell sm_120 対応）。
# macOS ローカル開発環境では PyPI デフォルト（CPU版）を使用する。
# ─────────────────────────────────────────────────
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true  # torch / torchvision にのみ使用する

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
